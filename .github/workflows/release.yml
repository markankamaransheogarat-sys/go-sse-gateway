name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            bin="go-sse-gateway"
            stage="dist/${GOOS}-${GOARCH}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "${stage}/${bin}" ./cmd/gateway
            tar -czf "dist/go-sse-gateway-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}.tar.gz" -C "$stage" "$bin"
            rm -rf "$stage"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
